name: Publish to Comfy registry

# Fires when pyproject.toml lands on main - which in practice means the
# version field changed, since nothing else in that file moves often.
# Publishing a release is therefore: bump the version, commit, push.
# workflow_dispatch is there for re-running a publish that failed for a
# reason unrelated to the code, without an empty commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    # comfy-cli reads the version's changelog from this variable and the
    # publish action never passes one, so without it the registry entry
    # is silently blank. Job-level so the composite action's steps see
    # it. Versions are immutable: set it BEFORE the push that publishes.
    env:
      COMFY_NODE_CHANGELOG: |
        Download an export: an Exports dropdown beside the export buttons
        lists every master the project has written, with a Download
        button, for installs where the output folder cannot be reached.
        Opening the project panel no longer starts playing on its own.
        See CHANGELOG.md.
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          # Repository secret, added under
          # Settings -> Secrets and variables -> Actions.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
