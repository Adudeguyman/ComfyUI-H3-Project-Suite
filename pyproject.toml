[project]
name = "comfyui-h3-project-suite"
description = "Long-form video with MiniMax H3: chain clips that genuinely continue each other in picture and sound, managed as projects with review, takes, branching and export. The chain hands each clip to the next in latent space, so no decode/re-encode round trip sits between clips. Node ids H3ProjectHub, H3ProjectSave, H3Context, H3ContextTrim, H3ContextSaveLatent, H3ContextLoadLatent."
version = "1.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Adudeguyman" },
]
keywords = ["comfyui", "minimax-h3", "video-generation", "audio", "clip-chaining", "video-continuation", "project-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/Adudeguyman/ComfyUI-H3-Project-Suite"
Repository = "https://github.com/Adudeguyman/ComfyUI-H3-Project-Suite"
Issues = "https://github.com/Adudeguyman/ComfyUI-H3-Project-Suite/issues"

[tool.comfy]
PublisherId = "fantastic-loras"
DisplayName = "H3 Project Suite"
Icon = ""
